<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="logo">✦</span>
                <span class="brand-text">Evergreen</span>
            </div>

            <div class="season-card">
                <span class="season-label">Field Season</span>
                <span class="season-date">
                    <span class="day-label">Day <span id="dayNumber">1</span></span>
                </span>
            </div>

            <div class="score-card">
                <span class="score-label">Eco Score</span>
                <span class="score-number" id="scoreNumber">0</span>
            </div>

            <div class="nav-list">
                <div class="nav-item active">
                    <span class="nav-icon">♞</span>
                    <span class="nav-text">Forest Map</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">✎</span>
                    <span class="nav-text">Habitat Log</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">☼</span>
                    <span class="nav-text">Weather</span>
                </div>
            </div>
        </aside>

        <main class="game-panel">
            <section class="topbar">
                <div>
                    <span class="kicker">Wild Systems</span>
                    <h1>Forest Keeper</h1>
                </div>
                <div class="weather-card">
                    <span class="weather-icon">☀</span>
                    <span class="weather-name" id="weatherName">Sun</span>
                </div>
                <button class="next-day" id="nextDayBtn">Next Day</button>
            </section>

            <section class="dashboard">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-label">Energy</span>
                        <span class="metric-value" id="energyValue">84%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill energy" id="energyMeter"></div>
                    </div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-label">Water</span>
                        <span class="metric-value" id="waterValue">56%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill water" id="waterMeter"></div>
                    </div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-label">Health</span>
                        <span class="metric-value" id="healthValue">78%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill health" id="healthMeter"></div>
                    </div>
                </div>
            </section>

            <section class="content-grid">
                <section class="map-card">
                    <div class="card-title">
                        <span>Habitat Map</span>
                        <span class="map-actions">
                            <button class="mini-button">◎</button>
                            <button class="mini-button">⌁</button>
                        </span>
                    </div>

                    <section class="forest-map" id="forestMap">
                        <span class="tree-icon">🌲</span>
                        <span class="tree-icon">🌳</span>
                        <span class="tree-icon">🌲</span>
                        <span class="tree-icon">🌳</span>
                        <span class="tree-icon">🌲</span>
                        <span class="tree-icon">🌳</span>
                        <span class="tree-icon">🌲</span>
                        <span class="tree-icon">🌳</span>
                        <span class="tree-icon">🌲</span>
                    </section>

                    <section class="map-legend">
                        <div><span class="legend-dot trees-dot"></span>Trees <span class="legend-value" id="treesValue">18</span></div>
                        <div><span class="legend-dot life-dot"></span>Wildlife <span class="legend-value" id="wildlifeValue">42%</span></div>
                    </section>
                </section>

                <section class="actions-card">
                    <div class="card-title">
                        <span>Field Actions</span>
                    </div>

                    <div class="action-list">
                        <button class="action-button" id="plantBtn">
                            <span class="action-icon">✦</span>
                            <span class="action-text">Plant Tree</span>
                            <span class="action-arrow">+</span>
                        </button>

                        <button class="action-button" id="waterBtn">
                            <span class="action-icon">♬</span>
                            <span class="action-text">Water</span>
                            <span class="action-arrow">+</span>
                        </button>

                        <button class="action-button" id="scoutBtn">
                            <span class="action-icon">⌕</span>
                            <span class="action-text">Scout</span>
                            <span class="action-arrow">+</span>
                        </button>

                        <button class="action-button" id="cleanBtn">
                            <span class="action-icon">☍</span>
                            <span class="action-text">Clean</span>
                            <span class="action-arrow">+</span>
                        </button>
                    </div>
                </section>
            </section>

            <section class="bottom-grid">
                <section class="log-card">
                    <div class="card-title">
                        <span>Field Log</span>
                    </div>
                    <ul class="event-log" id="eventLog">
                    </ul>
                </section>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
</html>
