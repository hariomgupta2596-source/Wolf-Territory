<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Territory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrap">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">♞</span>
                <span class="brand-name">Wolf Territory</span>
            </div>

            <div class="season-box">
                <span class="label-small">Northern Range</span>
                <div class="day-row">
                    <span class="day-text">Day <span id="dayNumber">01</span></span>
                </div>
            </div>

            <div class="score-box">
                <span class="label-small">Pack Score</span>
                <span class="score-number" id="scoreNumber">0</span>
            </div>

            <div class="nav-list">
                <div class="nav-item active">
                    <span class="nav-icon">✦</span>
                    <span class="nav-text">Open World</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">⌕</span>
                    <span class="nav-text">Tracking</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">☼</span>
                    <span class="nav-text">Territory</span>
                </div>
            </div>
        </aside>

        <main class="game-panel">
            <section class="topbar">
                <div class="title-block">
                    <span class="kicker">Wild Systems // 07</span>
                    <h1>Wolf Ridge</h1>
                </div>

                <div class="weather-box">
                    <span class="weather-icon">☼</span>
                    <span class="weather-text" id="terrainName">Northern Ridge</span>
                </div>

                <button class="next-day" id="nextDayBtn">Next Day</button>
            </section>

            <section class="dashboard">
                <article class="metric-card">
                    <div class="metric-head">
                        <span class="metric-label">Energy</span>
                        <span class="metric-value" id="energyValue">84%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill meter-energy" id="energyMeter"></div>
                    </div>
                </article>

                <article class="metric-card">
                    <div class="metric-head">
                        <span class="metric-label">Water</span>
                        <span class="metric-value" id="waterValue">62%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill meter-water" id="waterMeter"></div>
                    </div>
                </article>

                <article class="metric-card">
                    <div class="metric-head">
                        <span class="metric-label">Health</span>
                        <span class="metric-value" id="healthValue">80%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill meter-health" id="healthMeter"></div>
                    </div>
                </article>

                <article class="metric-card">
                    <div class="metric-head">
                        <span class="metric-label">Territory</span>
                        <span class="metric-value" id="territoryValue">48%</span>
                    </div>
                    <div class="meter">
                        <div class="meter-fill meter-territory" id="territoryMeter"></div>
                    </div>
                </article>
            </section>

            <section class="content-grid">
                <section class="map-panel">
                    <div class="panel-title">
                        <span>Open World</span>
                        <span class="map-icons">
                            <span class="icon-button">⌁</span>
                            <span class="icon-button">◎</span>
                        </span>
                    </div>

                    <section class="open-map">
                        <div class="map-sky">
                            <span class="sun">☼</span>
                            <span class="moon hidden">☽</span>
                            <span class="ridge ridge-one"></span>
                            <span class="ridge ridge-two"></span>
                            <span class="ridge ridge-three"></span>
                            <span class="forest forest-one"></span>
                            <span class="forest forest-two"></span>
                            <span class="forest forest-three"></span>
                            <span class="river"></span>
                            <span class="wolf-marker" id="wolfMarker">
                                <span class="wolf-icon">🐺</span>
                            </span>
                        </div>
                    </section>

                    <section class="legend-row">
                        <span class="legend-item"><span class="legend-swatch trees"></span>Trees <span class="legend-value" id="treesCount">136</span></span>
                        <span class="legend-item"><span class="legend-swatch pack"></span>Pack <span class="legend-value" id="packValue">7</span></span>
                        <span class="legend-item"><span class="legend-swatch hunger"></span>Hunger <span class="legend-value" id="hungerValue">32%</span></span>
                    </section>
                </section>

                <section class="control-panel">
                    <div class="panel-title">
                        <span>Wolf Control</span>
                    </div>

                    <div class="joystick-wrap">
                        <div class="joystick">
                            <button class="control-button up" id="upBtn">▲</button>
                            <div class="joystick-row">
                                <button class="control-button" id="leftBtn">◀</button>
                                <button class="control-button" id="rightBtn">▶</button>
                            </div>
                            <button class="control-button down" id="downBtn">▼</button>
                        </div>
                    </div>

                    <div class="action-list">
                        <button class="action-button" id="huntBtn">
                            <span class="action-icon">✦</span>
                            <span class="action-text">Hunt</span>
                            <span class="action-arrow">></span>
                        </button>

                        <button class="action-button" id="forageBtn">
                            <span class="action-icon">✎</span>
                            <span class="action-text">Forage</span>
                            <span class="action-arrow">></span>
                        </button>

                        <button class="action-button" id="restBtn">
                            <span class="action-icon">☼</span>
                            <span class="action-text">Rest</span>
                            <span class="action-arrow">></span>
                        </button>
                    </div>
                </section>
            </section>

            <section class="log-panel">
                <div class="panel-title">
                    <span>Tracking Log</span>
                </div>
                <ul class="event-log" id="eventLog"></ul>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
